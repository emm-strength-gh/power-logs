<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EmmStrength Spotter</title>
<!-- The app lives in power-logs.html; this forwards the bare repo URL to it so you
     can add either address to your home screen. Safe to delete if you'd rather
     link straight to power-logs.html. -->
<meta http-equiv="refresh" content="0; url=./power-logs.html" />
<link rel="canonical" href="./power-logs.html" />
<script>location.replace("./power-logs.html");</script>
<style>
  /* No double-tap-to-zoom on phones (it also fires on quick repeated taps of
     buttons). Pinch-zoom still works. Zero specificity, so any element that
     sets its own touch-action (drag handles, drawing canvases) still wins. */
  * { touch-action: manipulation; }
  body { background: #f1f3ee; color: #6b736c; font-family: system-ui, sans-serif;
         display: grid; place-items: center; height: 100vh; margin: 0; }
  a { color: #2e5a4e; }
</style>
</head>
<body>
<p>Redirecting to <a href="./power-logs.html">Spotter</a>&hellip;</p>
</body>
</html>
